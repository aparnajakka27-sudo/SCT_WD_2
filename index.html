<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="title-container">
                <h1>Stopwatch</h1>
                <p>Track your time precisely</p>
            </div>
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </header>

        <main class="stopwatch-card">
            <div id="status-indicator" class="status-indicator">
                <span class="dot"></span> <span id="status-text">Ready</span>
            </div>

            <div class="time-display">
                <div class="time-part">
                    <span id="hours">00</span>
                    <label>HH</label>
                </div>
                <span class="colon">:</span>
                <div class="time-part">
                    <span id="minutes">00</span>
                    <label>MM</label>
                </div>
                <span class="colon">:</span>
                <div class="time-part">
                    <span id="seconds">00</span>
                    <label>SS</label>
                </div>
                <div class="time-part milliseconds-part">
                    <span id="milliseconds">.000</span>
                    <label>MMM</label>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn primary">Start</button>
                <button id="pause-btn" class="btn primary hidden">Pause</button>
                <button id="lap-btn" class="btn secondary" disabled>Lap</button>
                <button id="reset-btn" class="btn danger" disabled>Reset</button>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <span class="stat-label">Total Laps</span>
                    <span id="total-laps" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Fastest Lap</span>
                    <span id="fastest-lap" class="stat-value">--:--.---</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Slowest Lap</span>
                    <span id="slowest-lap" class="stat-value">--:--.---</span>
                </div>
            </div>

            <div class="laps-container">
                <div class="laps-header">
                    <h3>Lap Times</h3>
                    <span id="lap-count">0 laps</span>
                </div>
                <div class="laps-table-header">
                    <span>#</span>
                    <span>Lap Time</span>
                    <span>Total Time</span>
                    <span>Status</span>
                </div>
                <div id="laps-list" class="laps-list">
                    <div class="empty-laps">No laps recorded yet.</div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
